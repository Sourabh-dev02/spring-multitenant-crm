spring:
  application:
    name: multitenant-crm

  datasource:
    url: jdbc:postgresql://localhost:5432/crm_db
    username: crm_user
    password: crm_pass
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: CrmHikariPool
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 20000
      # keep-alive-time is useful if your DB drops idle connections
      keepalive-time: 60000

  jpa:
    # Let Flyway manage the public schema; tenant schemas are provisioned at runtime
    hibernate:
      ddl-auto: none
    # Show SQL in dev, turn off in prod (use p6spy or datasource-proxy instead)
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 50
          batch_versioned_data: true
        order_inserts: true
        order_updates: true
        # flip to true when benchmarking - gives you L2 cache hit/miss stats
        generate_statistics: false
        cache:
          use_second_level_cache: true
          use_query_cache: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    default-schema: public
    # Only Flyway manages the public schema - tenant schemas are done via TenantProvisioningService
    schemas: public

  cache:
    # Caffeine is used for @Cacheable at the service layer
    # Hibernate L2 uses EhCache directly via JCache (configured separately in ehcache.xml)
    type: caffeine
    caffeine:
      spec: maximumSize=2000,expireAfterWrite=30m,recordStats

  security:
    # We're using simple header-based tenant isolation for this POC
    # Replace this whole section with real JWT config in production
    user:
      name: admin
      password: poc-change-this

server:
  port: 8080
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,caches,env
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

logging:
  level:
    com.crm: DEBUG
    org.hibernate.SQL: DEBUG
    # uncomment to log bind params (noisy but useful for debugging)
    # org.hibernate.orm.jdbc.bind: TRACE

info:
  app:
    name: Multi-Tenant CRM
    description: Spring Data JPA + Hibernate multi-tenancy POC
    version: 1.0.0-SNAPSHOT
